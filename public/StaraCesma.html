<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stara Česma Cross-Fade Slideshow</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1120;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    /* Popup Styling */
    .popup-card {
      width: 260px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    .popup-card h3 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.02em;
    }

    .slider-box {
      position: relative;
      width: 100%;
      height: 180px;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Stacked images for true GPU cross-fade */
    .slide-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      pointer-events: none;
    }

    .slide-img.active {
      opacity: 1;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.7);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: rgba(14, 165, 233, 0.9);
    }

    .prev-btn {
      left: 8px;
    }

    .next-btn {
      right: 8px;
    }

    .caption {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <script>
    // Coordinates for Stara Česma / Trg slobode, Tuzla
    const cesmaCoords = [18.675580, 44.538982];

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://demotiles.maplibre.org/style.json',
      center: cesmaCoords,
      zoom: 16
    });

    const slides = [
      { src: '/assets/Gallery/Photos/cesma1.webp', label: '1 / 3 — Historical Archive View' },
      { src: '/assets/Gallery/Photos/cesma12.webp', label: '2 / 3 — Daytime Town Square' },
      { src: '/assets/Gallery/Photos/cesma13.webp', label: '3 / 3 — Evening Festive Illumination' }
    ];

    let slideInterval = null;

    function createLazyCesmaPopup() {
      let currentIndex = 0;

      const container = document.createElement('div');
      container.className = 'popup-card';

      const imagesHTML = slides
        .map((slide, i) => `
        <img 
          class="slide-img ${i === 0 ? 'active' : ''}" 
          src="${slide.src}" 
          alt="Stara Cesma view ${i + 1}" 
        />
      `)
        .join('');

      container.innerHTML = `
      <h3>Stara Česma (Tuzla)</h3>
      <div class="slider-box">
        <button class="nav-btn prev-btn" aria-label="Previous">&#10094;</button>
        ${imagesHTML}
        <button class="nav-btn next-btn" aria-label="Next">&#10095;</button>
      </div>
      <div id="cesma-caption" class="caption">${slides[0].label}</div>
    `;

      const imgElements = container.querySelectorAll('.slide-img');
      const captionEl = container.querySelector('#cesma-caption');

      const updateSlide = (newIndex) => {
        imgElements[currentIndex].classList.remove('active');
        currentIndex = newIndex;
        imgElements[currentIndex].classList.add('active');
        captionEl.textContent = slides[currentIndex].label;
      };

      container.querySelector('.prev-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (slideInterval) clearInterval(slideInterval);
        updateSlide((currentIndex - 1 + slides.length) % slides.length);
      });

      container.querySelector('.next-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (slideInterval) clearInterval(slideInterval);
        updateSlide((currentIndex + 1) % slides.length);
      });

      return { container, updateSlide };
    }

    const popup = new maplibregl.Popup({ offset: 25, closeButton: false });
    let popupController = null;

    popup.on('open', () => {
      if (!popupController) {
        popupController = createLazyCesmaPopup();
        popup.setDOMContent(popupController.container);
      }

      const sequence = [0, 1, 2, 0, 1, 2];
      let step = 0;

      if (slideInterval) clearInterval(slideInterval);

      slideInterval = setInterval(() => {
        step++;
        if (step < sequence.length) {
          popupController.updateSlide(sequence[step]);
        } else {
          clearInterval(slideInterval);
          slideInterval = null;
        }
      }, 1000);
    });

    popup.on('close', () => {
      if (slideInterval) {
        clearInterval(slideInterval);
        slideInterval = null;
      }
    });

    new maplibregl.Marker({ color: '#0ea5e9' })
      .setLngLat(cesmaCoords)
      .setPopup(popup)
      .addTo(map);

    map.on('load', () => {
      popup.setLngLat(cesmaCoords).addTo(map);
    });
  </script>

</body>

</html>
