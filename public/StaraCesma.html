<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stara Česma Cross-Fade Slideshow</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    /* Popup Styling */
    .popup-card { width: 250px; font-family: system-ui, sans-serif; }
    .popup-card h3 { margin: 0 0 8px; font-size: 15px; color: #1f2937; }
    .slider-box {
      position: relative;
      width: 100%;
      height: 180px;
      background: #111827;
      border-radius: 6px;
      overflow: hidden;
    }

    /* Stacked images for true GPU cross-fade */
    .slide-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.45s ease-in-out;
      pointer-events: none;
    }
    .slide-img.active {
      opacity: 1;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 14px;
      z-index: 2;
    }
    .nav-btn:hover { background: rgba(0, 0, 0, 0.8); }
    .prev-btn { left: 6px; }
    .next-btn { right: 6px; }
    .caption {
      margin-top: 6px;
      font-size: 12px;
      color: #4b5563;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // Coordinates for Stara Česma / Trg stare tržnice, Tuzla
  const cesmaCoords = [18.6776, 44.5393];

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json',
    center: cesmaCoords,
    zoom: 16
  });

  const slides = [
    { src: 'cesma1.webp', label: '1 / 3 — Historical Archive View' },
    { src: 'cesma12.webp', label: '2 / 3 — Daytime Town Square' },
    { src: 'cesma13.webp', label: '3 / 3 — Evening Festive Illumination' }
  ];

  let slideInterval = null;

  // Lazy-loading popup factory with stacked cross-fade images
  function createLazyCesmaPopup() {
    let currentIndex = 0;

    const container = document.createElement('div');
    container.className = 'popup-card';

    const imagesHTML = slides
      .map((slide, i) => `
        <img 
          class="slide-img ${i === 0 ? 'active' : ''}" 
          src="${slide.src}" 
          alt="Stara Cesma view ${i + 1}" 
        />
      `)
      .join('');

    container.innerHTML = `
      <h3>Stara Česma (Tuzla)</h3>
      <div class="slider-box">
        <button class="nav-btn prev-btn" aria-label="Previous">&#10094;</button>
        ${imagesHTML}
        <button class="nav-btn next-btn" aria-label="Next">&#10095;</button>
      </div>
      <div id="cesma-caption" class="caption">${slides[0].label}</div>
    `;

    const imgElements = container.querySelectorAll('.slide-img');
    const captionEl = container.querySelector('#cesma-caption');

    const updateSlide = (newIndex) => {
      imgElements[currentIndex].classList.remove('active');
      currentIndex = newIndex;
      imgElements[currentIndex].classList.add('active');
      captionEl.textContent = slides[currentIndex].label;
    };

    // Manual controls
    container.querySelector('.prev-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (slideInterval) clearInterval(slideInterval);
      updateSlide((currentIndex - 1 + slides.length) % slides.length);
    });

    container.querySelector('.next-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (slideInterval) clearInterval(slideInterval);
      updateSlide((currentIndex + 1) % slides.length);
    });

    return { container, updateSlide };
  }

  const popup = new maplibregl.Popup({ offset: 25 });
  let popupController = null;

  popup.on('open', () => {
    if (!popupController) {
      popupController = createLazyCesmaPopup();
      popup.setDOMContent(popupController.container);
    }

    // 2 rounds (0 -> 1 -> 2 -> 0 -> 1 -> 2), 1 second per step, stopping on cesma13.webp
    const sequence = [0, 1, 2, 0, 1, 2];
    let step = 0;

    if (slideInterval) clearInterval(slideInterval);

    slideInterval = setInterval(() => {
      step++;
      if (step < sequence.length) {
        popupController.updateSlide(sequence[step]);
      } else {
        clearInterval(slideInterval);
        slideInterval = null;
      }
    }, 1000);
  });

  popup.on('close', () => {
    if (slideInterval) {
      clearInterval(slideInterval);
      slideInterval = null;
    }
  });

  new maplibregl.Marker({ color: '#0ea5e9' })
    .setLngLat(cesmaCoords)
    .setPopup(popup)
    .addTo(map);
</script>

</body>
</html>
