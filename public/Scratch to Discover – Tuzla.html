<title>Scratch to Discover – Tuzla</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3ede1;--fg:#3a2a10;--muted:#7a6644;--card:#fffaf0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130c;--fg:#f1e3bd;--muted:#b49c66;--card:#241d10}}
:root[data-theme="dark"]{--bg:#17130c;--fg:#f1e3bd;--muted:#b49c66;--card:#241d10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,var(--card),var(--bg) 70%);color:var(--fg);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px}
.wrap{position:relative;width:min(88vw,340px);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 0 3px #c8921f;touch-action:none;user-select:none;-webkit-user-select:none}
.wrap img{display:block;width:100%;height:auto;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#cover{animation:shine 2.6s ease-in-out infinite;transition:opacity .9s ease}
#cover.done{opacity:0;pointer-events:none}
#fx{pointer-events:none}
@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14) saturate(1.1)}}
.hint{min-height:1.6em;font-size:14px;font-style:italic;color:var(--muted);text-align:center;opacity:0;transform:translateY(8px);transition:opacity 1s .5s,transform 1s .5s}
.hint.show{opacity:1;transform:none}
button{background:none;border:0;color:var(--muted);font:12px Georgia,serif;text-decoration:underline;cursor:pointer;opacity:.7}
</style></head><body>

}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function scratch(a,b){
  ctx.globalCompositeOperation='destination-out';ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=R()*2;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  const k=mask.width/W;mctx.strokeStyle='#fff';mctx.lineCap='round';mctx.lineWidth=R()*2*k;
  mctx.beginPath();mctx.moveTo(a.x*k,a.y*k);mctx.lineTo(b.x*k,b.y*k);mctx.stroke();
  for(let i=0;i<3;i++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*3,vy:Math.random()*-2.5-.5,l:1,s:1+Math.random()*2.2});
}
function coverage(){const d=mctx.getImageData(0,0,mask.width,mask.height).data;let c=0;for(let i=3;i<d.length;i+=4)if(d[i]>100)c++;return c/(d.length/4)}
function reveal(){
  done=true;cv.classList.add('done');hint.classList.add('show');
  for(let i=0;i<120;i++)parts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*2,vy:-Math.random()*2.5,l:1,s:1.5+Math.random()*2.5});
}
wrap.addEventListener('pointerdown',e=>{if(done)return;wrap.setPointerCapture(e.pointerId);last=pos(e);scratch(last,last)});
wrap.addEventListener('pointermove',e=>{
  if(!last||done)return;const p=pos(e);scratch(last,p);last=p;
  const n=performance.now();if(n-lastCheck>120){lastCheck=n;if(coverage()>.55)reveal()}
});
const end=()=>{last=null;if(!done&&coverage()>.55)reveal()};
wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
function loop(){
  fctx.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.025;fctx.globalAlpha=Math.max(p.l,0);fctx.fillStyle='#ffd978';fctx.beginPath();fctx.arc(p.x,p.y,p.s,0,6.283);fctx.fill()}
  fctx.globalAlpha=1;requestAnimationFrame(loop);
}
document.getElementById('reset').onclick=()=>{parts=[];setup()};
let ready=0;const go=()=>{if(++ready===2){setup();loop()}};
emb.onload=go;emb.src=EMB;
if(stone.complete)go();else stone.onload=go;
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!done)setup()},200)});
</script></body></html>
