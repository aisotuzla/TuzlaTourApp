<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Povelja Kulina bana</title>
    <style>
        :root {
            --bg: #1b1511;
            --ink: #f1ddb1;
            --paper: #e5c686;
            --paper2: #d6b77d;
            --txt: #3a2410;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: radial-gradient(circle at 50% 40%, #4a3a2b, var(--bg) 70%);
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none
        }

        #stage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1800px;
            touch-action: none;
            cursor: grab
        }

        #cube {
            position: relative;
            transform-style: preserve-3d;
            width: var(--w);
            height: var(--h)
        }

        .f {
            position: absolute;
            top: 0;
            width: var(--w);
            height: var(--h);
            left: 0;
            backface-visibility: hidden;
            background: var(--paper) center/100% 100% no-repeat
        }

        .front {
            transform: translateZ(calc(var(--w)/2))
        }

        .back {
            transform: rotateY(180deg) translateZ(calc(var(--w)/2))
        }

        .right {
            transform: rotateY(90deg) translateZ(calc(var(--w)/2))
        }

        .left {
            transform: rotateY(-90deg) translateZ(calc(var(--w)/2))
        }

        .top,
        .bottom {
            height: var(--w);
            top: calc((var(--h) - var(--w))/2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--txt);
            font-weight: bold;
            letter-spacing: .06em;
            background: radial-gradient(ellipse at 40% 30%, #e3cd9c, var(--paper2));
            font-size: calc(var(--w)/9);
            line-height: 1.25;
            box-shadow: inset 0 0 40px rgba(60, 35, 10, .45)
        }

        .top {
            transform: rotateX(90deg) translateZ(calc(var(--h)/2))
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--h)/2))
        }

        #bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 0 12px
        }

        button {
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            background: rgba(241, 228, 200, .12);
            border: 1px solid rgba(241, 228, 200, .4);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer
        }

        button:hover {
            background: rgba(241, 228, 200, .25)
        }

        button:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px
        }

        #hint {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            opacity: .75;
            pointer-events: none
        }
    </style>
</head>

    </div>
    <div id="bar">
        <button data-x="0" data-y="0">Bosnian</button>
        <button data-x="0" data-y="-90">Original manuscript</button>
        <button data-x="0" data-y="-180">English</button>
        <button data-x="0" data-y="-270">Cyrillic transcription</button>
        <button data-x="-90" data-y="0">Top</button>
        <button id="auto">Auto-spin: off</button>
    </div>
    <script>
        const cube = document.getElementById('cube'), stage = document.getElementById('stage'), a = document.getElementById('auto');
        const AR = 548 / 915;
        let rx = -12, ry = -20, scale = 1, spin = false, drag = null, target = null, pd = 0;
        function size() { const h = Math.min(innerHeight * .66 * scale, innerWidth * .8 * scale / AR); cube.style.setProperty('--w', h * AR + 'px'); cube.style.setProperty('--h', h + 'px') }
        function draw() { cube.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)' }
        size(); draw(); addEventListener('resize', size);
        stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; target = null; stage.setPointerCapture(e.pointerId) });
        stage.addEventListener('pointermove', e => { if (!drag) return; ry += (e.clientX - drag.x) * .4; rx -= (e.clientY - drag.y) * .4; rx = Math.max(-90, Math.min(90, rx)); drag = { x: e.clientX, y: e.clientY }; draw() });
        stage.addEventListener('pointerup', () => drag = null); stage.addEventListener('pointercancel', () => drag = null);
        stage.addEventListener('wheel', e => { e.preventDefault(); scale = Math.max(.5, Math.min(1.8, scale - e.deltaY * .001)); size() }, { passive: false });
        stage.addEventListener('touchmove', e => { if (e.touches.length == 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (pd) { scale = Math.max(.5, Math.min(1.8, scale * d / pd)); size() } pd = d } }, { passive: true });
        stage.addEventListener('touchend', () => pd = 0);
        document.querySelectorAll('button[data-x]').forEach(b => b.onclick = () => {
            spin = false; a.textContent = 'Auto-spin: off';
            const ty = +b.dataset.y, dy = ((ty - ry) % 360 + 540) % 360 - 180; target = { x: +b.dataset.x, y: ry + dy }
        });
        a.onclick = () => { spin = !spin; target = null; a.textContent = 'Auto-spin: ' + (spin ? 'on' : 'off') };
        (function tick() {
            if (target && !drag) { rx += (target.x - rx) * .12; ry += (target.y - ry) * .12; if (Math.abs(target.x - rx) < .1 && Math.abs(target.y - ry) < .1) target = null; draw() }
            else if (spin && !drag) { ry += .4; draw() } requestAnimationFrame(tick)
        })();
    </script>
</body>
