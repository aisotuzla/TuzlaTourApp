<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Tuzla Digital Souvenir — Pannonian Salt Crystal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at center, #162436 0%, #090e17 100%);
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* Top Location Badge */
        .header-card {
            position: relative;
            z-index: 2;
            margin: 20px auto 0;
            padding: 14px 22px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .coords {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Bottom Action & Timestamp Card */
        .footer-card {
            position: relative;
            z-index: 2;
            margin: 0 auto 28px;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            text-align: center;
            width: 340px;
            max-width: 92%;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
        }

        .hint {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .timestamp {
            font-size: 0.85rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            padding: 13px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #090e17;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.35);
        }

        button:active {
            transform: scale(0.97);
        }

        .saved-banner {
            display: none;
            font-size: 0.82rem;
            color: #34d399;
            font-weight: 600;
            padding: 8px;
            background: rgba(52, 211, 153, 0.12);
            border-radius: 10px;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
    </style>
</head>

<body>

    <div class="header-card">
        <div class="badge">Tuzla Landmark Unlocked</div>
        <h1>Pannonian Salt Crystal</h1>
        <div class="coords">44.5384° N, 18.6671° E • Tuzla, BiH</div>
    </div>

    <div id="canvas-container"></div>

    <div class="footer-card">
        <div class="hint">Drag to rotate • Pinch or scroll to zoom</div>
        <div class="timestamp" id="visit-time">Unlocked: Loading...</div>
        <button id="download-btn" onclick="downloadKeepsake()">Download Offline Keepsake (.html)</button>
        <div class="saved-banner" id="saved-banner">✓ Saved Digital Souvenir — Tuzla</div>
    </div>

    <!-- Three.js & OrbitControls via CDN (see note below for 100% offline bundling) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Stamp the exact visit date/time on first unlock
        const timeEl = document.getElementById('visit-time');
        if (!timeEl.dataset.locked) {
            const now = new Date();
            const formatted = now.toLocaleDateString(undefined, {
                year: 'numeric', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
            timeEl.textContent = `Visited: ${formatted}`;
            timeEl.dataset.locked = "true";
        }

        // 2. Initialize Three.js Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.2, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 3;
        controls.maxDistance = 9;

        // 3. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0x38bdf8, 1.8);
        keyLight.position.set(4, 6, 4);
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0xf472b6, 1.2);
        rimLight.position.set(-4, 2, -4);
        scene.add(rimLight);

        // 4. Build the 3D Souvenir Group (Map Base + Floating Salt Crystal)
        const souvenirGroup = new THREE.Group();
        scene.add(souvenirGroup);

        // Stylized Map Disc Pedestal
        const baseGeo = new THREE.CylinderGeometry(1.5, 1.6, 0.18, 48);
        const baseMat = new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            metalness: 0.4,
            roughness: 0.3
        });
        const baseDisc = new THREE.Mesh(baseGeo, baseMat);
        baseDisc.position.y = -1.1;
        souvenirGroup.add(baseDisc);

        // Glowing Map Ring
        const ringGeo = new THREE.RingGeometry(1.25, 1.35, 48);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            side: THREE.DoubleSide
        });
        const mapRing = new THREE.Mesh(ringGeo, ringMat);
        mapRing.rotation.x = -Math.PI / 2;
        mapRing.position.y = -1.0;
        souvenirGroup.add(mapRing);

        // Main Tuzla Salt Crystal Cluster (Procedural Geometry)
        const crystalGroup = new THREE.Group();
        const crystalMat = new THREE.MeshPhysicalMaterial({
            color: 0xe0f2fe,
            emissive: 0x0284c7,
            emissiveIntensity: 0.25,
            roughness: 0.12,
            metalness: 0.1,
            transmission: 0.65,
            transparent: true,
            opacity: 0.92
        });

        // Central Spire
        const mainCrystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.85, 0), crystalMat);
        mainCrystal.scale.set(0.75, 1.45, 0.75);
        crystalGroup.add(mainCrystal);

        // Secondary Side Crystals
        const shard1 = new THREE.Mesh(new THREE.OctahedronGeometry(0.5, 0), crystalMat);
        shard1.position.set(0.55, -0.25, 0.2);
        shard1.rotation.z = -0.35;
        shard1.scale.set(0.7, 1.2, 0.7);
        crystalGroup.add(shard1);

        const shard2 = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 0), crystalMat);
        shard2.position.set(-0.5, -0.3, -0.15);
        shard2.rotation.z = 0.4;
        shard2.scale.set(0.7, 1.15, 0.7);
        crystalGroup.add(shard2);

        crystalGroup.position.y = 0.25;
        souvenirGroup.add(crystalGroup);

        // 5. Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // Gentle hover and rotation
            crystalGroup.rotation.y = elapsed * 0.6;
            crystalGroup.position.y = 0.25 + Math.sin(elapsed * 2) * 0.08;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Self-Contained HTML Keepsake Generator
        function downloadKeepsake() {
            // Clone the current document so we can modify it cleanly for offline storage
            const clone = document.documentElement.cloneNode(true);

            // Remove the old rendered canvas so the saved file doesn't duplicate it on load
            const clonedCanvasContainer = clone.querySelector('#canvas-container');
            if (clonedCanvasContainer) clonedCanvasContainer.innerHTML = '';

            // Swap the download button for the permanent "Saved Digital Souvenir" badge
            const btn = clone.querySelector('#download-btn');
            const banner = clone.querySelector('#saved-banner');
            if (btn) btn.style.display = 'none';
            if (banner) banner.style.display = 'block';

            // Package into a downloadable HTML file
            const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = 'Tuzla-Salt-Crystal-Souvenir.html';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
