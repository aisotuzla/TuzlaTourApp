const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;document.body.appendChild(r.domElement);
const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,50);let dist=8.2;
function stone(seed){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#c6c8cb';x.fillRect(0,0,512,512);
let n=seed;const R=()=>(n=(n*16807)%2147483647)/2147483647;
for(let i=0;i<40;i++){x.fillStyle=`rgba(${R()>.5?'255,250,235':'60,55,45'},${.03+R()*.05})`;x.beginPath();x.arc(R()*512,R()*512,20+R()*90,0,7);x.fill()}
for(let i=0;i<9000;i++){x.fillStyle=`rgba(${R()>.5?'255,255,245':'40,35,30'},${R()*.18})`;const z=R()*3;x.fillRect(R()*512,R()*512,z,z)}
const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t}
const sm=()=>{const t=stone(Math.floor(Math.random()*1e6)+1);return new THREE.MeshStandardMaterial({map:t,bumpMap:t,bumpScale:.4,roughness:.55,metalness:.15})};
const W=1.3,H=W*1024/368,D=1.3;
const g=new THREE.Group();s.add(g);
const front=new THREE.MeshStandardMaterial({roughness:.5,metalness:.15,color:0xf4f6fa,emissive:0x2a2d34});
new THREE.TextureLoader().load(IMG,t=>{t.anisotropy=16;front.map=t;front.bumpMap=t;front.emissiveMap=t;front.bumpScale=.3;front.needsUpdate=true});
const slab=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),[sm(),sm(),sm(),sm(),front,sm()]);slab.castShadow=slab.receiveShadow=true;g.add(slab);

const gr=new THREE.Mesh(new THREE.CircleGeometry(6,48),new THREE.ShadowMaterial({opacity:.35}));gr.rotation.x=-Math.PI/2;gr.position.y=-H/2-.01;gr.receiveShadow=true;s.add(gr);
s.add(new THREE.HemisphereLight(0xfff4e0,0x333028,.9));
const d=new THREE.DirectionalLight(0xfff0d8,.9);d.position.set(3,5,6);d.castShadow=true;d.shadow.mapSize.set(1024,1024);s.add(d);
const f=new THREE.DirectionalLight(0xaac0ff,.25);f.position.set(-5,1,-3);s.add(f);
let ry=0,rx=.05,auto=false,tgt=null,drag=false,lx=0,ly=0;
function rs(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();dist=innerWidth<innerHeight?9.5:8.2}
addEventListener('resize',rs);rs();
const el=r.domElement;
el.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;tgt=null;el.setPointerCapture(e.pointerId)};
el.onpointerup=()=>drag=false;
el.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-lx)*.01;rx=Math.max(-.6,Math.min(.6,rx+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY};
el.onwheel=e=>{e.preventDefault();dist=Math.max(4,Math.min(14,dist+e.deltaY*.005))};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{auto=false;const a=+b.dataset.a;ry=((ry%(2*Math.PI))+2*Math.PI)%(2*Math.PI);tgt=a;if(Math.abs(tgt-ry)>Math.PI&&tgt<ry)ry-=2*Math.PI;else if(Math.abs(tgt-ry)>Math.PI)ry+=2*Math.PI});
document.getElementById('auto').onclick=()=>{auto=!auto;tgt=null};
(function loop(){requestAnimationFrame(loop);if(auto&&!drag)ry+=.006;if(tgt!==null){ry+=(tgt-ry)*.1;if(Math.abs(tgt-ry)<.001)tgt=null}
g.rotation.set(rx,ry,0);cam.position.set(0,.3,dist);cam.lookAt(0,-.1,0);r.render(s,cam)})();
