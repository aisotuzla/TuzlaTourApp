<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Solidarity - Bosnia World Cup 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pitch-green: #2d5a27;
            --pitch-light: #3d7a35;
            --bih-blue: #002395;
            --bih-yellow: #fecb00;
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-orange: #d97757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--anthropic-light); color: var(--anthropic-dark); overflow: hidden; }
        
        .container { display: flex; height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 340px; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow-y: auto; }
        
        h1 { font-family: 'Lora', serif; font-size: 26px; margin-bottom: 8px; color: var(--pitch-green); }
        .subtitle { font-size: 14px; color: var(--anthropic-mid-gray); margin-bottom: 24px; line-height: 1.5; }

        .control-section { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
        .control-section h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; color: var(--anthropic-mid-gray); }

        .control-group { margin-bottom: 16px; }
        .control-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
        
        .slider-container { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; accent-color: var(--pitch-green); }
        .value-display { font-family: monospace; font-size: 12px; width: 40px; text-align: right; }

        .seed-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: monospace; margin-bottom: 10px; text-align: center; }
        .button-row { display: flex; gap: 8px; }
        .button { flex: 1; padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .button.primary { background: var(--pitch-green); color: white; }
        .button.secondary { background: #eee; color: #666; }
        .button:hover { opacity: 0.9; transform: translateY(-1px); }

        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #eee; border-radius: 12px; overflow: hidden; position: relative; }
        #canvas-container { box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        
        .branding-top { position: absolute; top: 40px; font-size: 48px; font-weight: 800; color: rgba(255,255,255,0.2); letter-spacing: 10px; pointer-events: none; }
        .branding-bottom { position: absolute; bottom: 40px; font-size: 48px; font-weight: 800; color: rgba(255,255,255,0.2); letter-spacing: 10px; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Emerald Solidarity</h1>
            <div class="subtitle">Bosnia and Herzegovina World Cup 2026 Generative Tribute. A fusion of national identity and the hallowed turf.</div>

            <div class="control-section">
                <h3>Identity</h3>
                <div class="control-group">
                    <label>Flag Integration</label>
                    <div class="slider-container">
                        <input type="range" id="flagOpacity" min="0" max="255" value="180" oninput="updateParam('flagOpacity', this.value)">
                        <span class="value-display">180</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Symbol Scale</label>
                    <div class="slider-container">
                        <input type="range" id="flagScale" min="0.5" max="1.5" step="0.01" value="1.0" oninput="updateParam('flagScale', this.value)">
                        <span class="value-display">1.0</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>The Pitch</h3>
                <div class="control-group">
                    <label>Grass Density</label>
                    <div class="slider-container">
                        <input type="range" id="grassDensity" min="1000" max="8000" step="500" value="4000" oninput="updateParam('grassDensity', this.value)">
                        <span class="value-display">4k</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Wind Velocity</label>
                    <div class="slider-container">
                        <input type="range" id="pitchNoise" min="0.001" max="0.05" step="0.001" value="0.01" oninput="updateParam('pitchNoise', this.value)">
                        <span class="value-display">0.01</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Mow Pattern</label>
                    <div class="slider-container">
                        <input type="range" id="mowStripes" min="5" max="20" step="1" value="12" oninput="updateParam('mowStripes', this.value)">
                        <span class="value-display">12</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Universe Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="1992">
                <div class="button-row">
                    <button class="button secondary" onclick="changeSeed(-1)">← Prev</button>
                    <button class="button secondary" onclick="changeSeed(1)">Next →</button>
                </div>
                <button class="button primary" style="margin-top:8px; width:100%" onclick="randomizeSeed()">Generate New Reality</button>
            </div>
            
            <button class="button secondary" style="width:100%" onclick="resetParams()">Reset to Perfection</button>
        </div>

        <div class="canvas-area">
            <div class="branding-top">WORLDCUP2026</div>
            <div id="canvas-container"></div>
            <div class="branding-bottom">WORLDCUP2026</div>
        </div>
    </div>

    <script>
        let params = {
            seed: 1992,
            flagOpacity: 180,
            flagScale: 1.0,
            grassDensity: 4000,
            pitchNoise: 0.01,
            mowStripes: 12
        };

        let blades = [];
        let stars = [];

        function setup() {
            let dim = Math.min(windowWidth - 400, windowHeight - 100);
            let canvas = createCanvas(dim, dim);
            canvas.parent('canvas-container');
            pixelDensity(2);
            initializeArt();
        }

        function initializeArt() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            blades = [];
            stars = [];

            // Initialize Stars
            for(let i = 0; i < 9; i++) {
                stars.push({
                    x: width * 0.35 + (i * width * 0.08) - (i * width * 0.01),
                    y: height * 0.25 + (i * height * 0.08),
                    size: width * 0.04
                });
            }

            // Initialize Grass Blades
            for(let i = 0; i < params.grassDensity; i++) {
                blades.push({
                    x: random(width),
                    y: random(height),
                    h: random(5, 15),
                    angle: random(TWO_PI),
                    phase: random(1000)
                });
            }
            
            background(30, 60, 25);
        }

        function draw() {
            // Slight motion over time
            let time = frameCount * 0.01;
            
            // Draw Pitch Base
            noStroke();
            let stripeW = width / params.mowStripes;
            for(let i = 0; i < params.mowStripes; i++) {
                fill(i % 2 === 0 ? color(45, 90, 40) : color(40, 80, 35));
                rect(i * stripeW, 0, stripeW, height);
            }

            // Draw Lines
            stroke(255, 30);
            strokeWeight(2);
            noFill();
            rect(5, 5, width-10, height-10); // Boundary
            line(0, height/2, width, height/2); // Halfway
            circle(width/2, height/2, width/4); // Center circle
            
            // Penalty areas
            rect(width/4, 0, width/2, height/10);
            rect(width/4, height - height/10, width/2, height/10);

            // Goals
            stroke(255, 150);
            strokeWeight(4);
            rect(width/2 - width/10, -5, width/5, 10);
            rect(width/2 - width/10, height-5, width/5, 10);

            // Draw BIH Flag Base (Triangle)
            push();
            translate(width/2, height/2);
            scale(params.flagScale);
            translate(-width/2, -height/2);
            
            noStroke();
            fill(0, 35, 149, params.flagOpacity); // BIH Blue
            rect(width*0.25, height*0.2, width*0.5, height*0.6);
            
            fill(254, 203, 0, params.flagOpacity); // BIH Yellow
            triangle(
                width*0.4, height*0.2,
                width*0.75, height*0.2,
                width*0.75, height*0.8
            );

            // Draw Stars
            fill(255, params.flagOpacity);
            for(let s of stars) {
                drawStar(s.x, s.y, s.size/2.5, s.size, 5);
            }
            pop();

            // Draw Grass Layer (Generative)
            for(let b of blades) {
                let n = noise(b.x * params.pitchNoise, b.y * params.pitchNoise, time);
                let wind = map(n, 0, 1, -0.5, 0.5);
                
                stroke(60, 120, 50, 100);
                strokeWeight(1);
                line(b.x, b.y, b.x + wind * 10, b.y - b.h);
            }
        }

        function drawStar(x, y, radius1, radius2, npoints) {
            let angle = TWO_PI / npoints;
            let halfAngle = angle / 2.0;
            beginShape();
            for (let a = -PI/2; a < TWO_PI-PI/2; a += angle) {
                let sx = x + cos(a) * radius2;
                let sy = y + sin(a) * radius2;
                vertex(sx, sy);
                sx = x + cos(a + halfAngle) * radius1;
                sy = y + sin(a + halfAngle) * radius1;
                vertex(sx, sy);
            }
            endShape(CLOSE);
        }

        function updateParam(id, val) {
            params[id] = parseFloat(val);
            document.querySelector(`#${id}`).nextElementSibling.textContent = 
                id === 'grassDensity' ? (val/1000).toFixed(1)+'k' : val;
            if(id === 'grassDensity' || id === 'seed') initializeArt();
        }

        function changeSeed(delta) {
            params.seed += delta;
            document.getElementById('seed-input').value = params.seed;
            initializeArt();
        }

        function randomizeSeed() {
            params.seed = floor(random(1000, 9999));
            document.getElementById('seed-input').value = params.seed;
            initializeArt();
        }

        function resetParams() {
            params = { seed: 1992, flagOpacity: 180, flagScale: 1.0, grassDensity: 4000, pitchNoise: 0.01, mowStripes: 12 };
            Object.keys(params).forEach(k => {
                let el = document.getElementById(k);
                if(el) el.value = params[k];
                updateParam(k, params[k]);
            });
            initializeArt();
        }

        function windowResized() {
            let dim = Math.min(windowWidth - 400, windowHeight - 100);
            resizeCanvas(dim, dim);
            initializeArt();
        }
    </script>
</body>
</html>
