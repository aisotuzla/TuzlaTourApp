    slides.forEach((_, i) => {
      const d = document.createElement('span'); d.className = 'dot';
      d.onclick = e => { e.stopPropagation(); show(i); };
      dots.appendChild(d);
    });
    function show(i) {
      cur = (i + slides.length) % slides.length;
      img.classList.add('fade');
      setTimeout(() => { img.src = slides[cur].src; img.classList.remove('fade'); }, 120);
      cap.textContent = (cur + 1) + ' / ' + slides.length + ' — ' + slides[cur].label;
      [...dots.children].forEach((d, k) => d.classList.toggle('active', k === cur));
    }
    el.querySelector('.prev').onclick = e => { e.stopPropagation(); show(cur - 1); };
    el.querySelector('.next').onclick = e => { e.stopPropagation(); show(cur + 1); };
    el.querySelector('.x').onclick = e => { e.stopPropagation(); popup.remove(); };
    img.src = slides[0].src; show(0);
    return el;
  }

  const popup = new maplibregl.Popup({ anchor: 'bottom', offset: [0, -38], maxWidth: 'none', closeButton: false, closeOnClick: false });
  popup.setDOMContent(buildPopup(popup));

  const marker = new maplibregl.Marker({ color: '#d97706' }).setLngLat(coords).setPopup(popup).addTo(map);

  map.on('load', () => { if (!popup.isOpen()) marker.togglePopup(); });
  setTimeout(() => { if (!popup.isOpen()) marker.togglePopup(); }, 1500);
</script>
</body>
</html>
