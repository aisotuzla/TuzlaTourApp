[dev]
  targetPort = 3000

  [build]
  command = "npm run build"
  functions = "netlify/functions"

  [[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  # Static asset headers
  [[headers]]
  for = "/assets/*.mp4"
  [headers.values]
  Content-Type = "video/mp4"

  [[headers]]
  for = "/assets/*.webm"
  [headers.values]
  Content-Type = "video/webm"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"