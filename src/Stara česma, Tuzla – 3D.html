<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stara česma, Tuzla – 3D</title>
<style>
:root{--ui-bg:rgba(255,255,255,.82);--ui-fg:#1d2a26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui-bg:rgba(20,28,26,.8);--ui-fg:#e6efeb}}
html,body{margin:0;height:100%;overflow:hidden;background:#9fc3d8;font-family:Georgia,'Times New Roman',serif}
canvas{display:block;touch-action:none;cursor:grab}
#ui{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.box{background:var(--ui-bg);color:var(--ui-fg);padding:8px 12px;border-radius:10px;font-size:14px;line-height:1.35;backdrop-filter:blur(6px)}
.box small{display:block;opacity:.75;font-size:12px}
button{pointer-events:auto;font:inherit;font-size:13px;border:0;cursor:pointer}
</style>
</head>
<body>
<div id="ui">
  <div class="box"><b>Čaršijska (Stara) česma</b><small>Tuzla · drag to rotate · scroll/pinch to zoom</small></div>
  <button class="box" id="rot">Auto‑rotate: on</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=()=>innerWidth,H=()=>innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W(),H());
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
// sky gradient
const sc=document.createElement('canvas');sc.width=2;sc.height=256;
const sg=sc.getContext('2d'),gr=sg.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#6fa4cf');gr.addColorStop(1,'#dce9ee');sg.fillStyle=gr;sg.fillRect(0,0,2,256);
scene.background=new THREE.CanvasTexture(sc);
scene.fog=new THREE.Fog(0xcfdde4,35,80);
const camera=new THREE.PerspectiveCamera(40,W()/H(),0.1,200);

scene.add(new THREE.HemisphereLight(0xffffff,0x887766,0.75));
const sun=new THREE.DirectionalLight(0xfff2dd,0.95);
sun.position.set(10,18,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:60});
scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o));
function add(g,m,x=0,y=0,z=0,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;parent.add(o);return o}

// stone texture
function stoneTex(){
  const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.fillStyle='#85827c';g.fillRect(0,0,512,512);
  const rows=4,rh=512/rows;let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let r=0;r<rows;r++){let x=-rnd()*80;while(x<512){const w=90+rnd()*80,l=205+rnd()*35|0;
    g.fillStyle=`rgb(${l-12},${l-12},${l-18})`;g.fillRect(x+3,r*rh+3,w-6,rh-6);x+=w}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,1);t.anisotropy=8;return t}

function noiseTex(base,amt,rep,streak){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,512,512);
 const im=g.getImageData(0,0,512,512),d=im.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(im,0,0);
 if(streak){for(let i=0;i<90;i++){g.fillStyle=`rgba(${Math.random()<.6?'25,55,40':'205,228,218'},${.04+Math.random()*.12})`;g.fillRect(Math.random()*512,0,2+Math.random()*12,512)}
  for(let i=0;i<25;i++){g.fillStyle=`rgba(20,35,30,${.05+Math.random()*.1})`;g.beginPath();g.arc(Math.random()*512,Math.random()*512,10+Math.random()*40,0,7);g.fill()}}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;return t}
const stT=stoneTex();
const stone=M(0xffffff,{map:stT,bumpMap:stT,bumpScale:2.5,roughness:.95});
const gT=noiseTex('#6a6d71',46,3,false);
const granite=M(0xffffff,{map:gT,bumpMap:gT,bumpScale:1.5,roughness:.7}), graniteTop=M(0xc4c4c4,{map:gT,bumpMap:gT,bumpScale:1.5,roughness:.65});
const pink=M(0xe3c3b2), cream=M(0xd8d1c3,{roughness:.9});
const gnT=noiseTex('#27885a',34,2,true);
const green=M(0xffffff,{map:gnT,bumpMap:gnT,bumpScale:1,roughness:.6}), frame=M(0xbfe6cf,{map:gnT,roughness:.6});
const cuT=noiseTex('#5fae9a',30,5,true);
const copper=M(0xffffff,{map:cuT,bumpMap:cuT,bumpScale:1.2,roughness:.5,metalness:.3});
const glass=new THREE.MeshStandardMaterial({color:0xffffff,map:noiseTex('#9fb2a8',70,1,true),roughness:.6,emissive:0x1f2a26,emissiveIntensity:.6,side:THREE.DoubleSide});

const f=new THREE.Group();scene.add(f);

// ground & steps
add(new THREE.CylinderGeometry(60,60,.2,48),M(0xffffff,{map:noiseTex('#8c8f93',55,40,false),roughness:1}),0,-.1,0);
const stepSizes=[13,11.4,9.8,8.2,6.6];
stepSizes.forEach((s,i)=>add(new THREE.BoxGeometry(s,.25,s),i%2?graniteTop:granite,0,.125+i*.25,0,f));
// basin
const basinY=1.25;
add(new THREE.CylinderGeometry(2.2,2.3,1.6,48),stone,0,basinY+.8,0,f);
add(new THREE.CylinderGeometry(2.35,2.35,.16,48),M(0xd9d3c4),0,basinY+1.68,0,f);
// octagon helper (flat faces toward multiples of 45°)
const oct=(r,h,m,y)=>{const o=add(new THREE.CylinderGeometry(r,r,h,8),m,0,y,0,f);o.rotation.y=Math.PI/8;return o};
oct(1.6,1.15,stone,3.0+.57);          // base 3.0-4.15
oct(1.75,.16,cream,4.23);            // cornice
// spouts
for(let i=0;i<8;i+=2){const a=i*Math.PI/4,n=new THREE.Vector3(Math.sin(a),0,Math.cos(a));
  const s=add(new THREE.CylinderGeometry(.05,.05,.28,10),M(0x888c90,{metalness:.6,roughness:.4}),n.x*1.6,3.5,n.z*1.6,f);
  s.rotation.set(Math.PI/2*Math.cos(a)*0+ (n.z? Math.PI/2:0),0,n.x? Math.PI/2:0);
  if(n.z){s.rotation.set(Math.PI/2,0,0)}else{s.rotation.set(0,0,Math.PI/2)}}
// shaft
const shaftR=1.45,shaftY0=4.31,shaftH=2.2;
oct(shaftR,shaftH,green,shaftY0+shaftH/2);
const ap=shaftR*Math.cos(Math.PI/8);
// windows
function arch(w,h){const s=new THREE.Shape();s.moveTo(-w/2,0);s.lineTo(w/2,0);s.lineTo(w/2,h-.18);
  s.quadraticCurveTo(w/2,h,0,h+.14);s.quadraticCurveTo(-w/2,h,-w/2,h-.18);return new THREE.ShapeGeometry(s)}
for(let i=0;i<8;i++){const a=i*Math.PI/4,n=[Math.sin(a),Math.cos(a)];
  const g=new THREE.Group();g.rotation.y=a;g.position.set(n[0]*ap,shaftY0+.55,n[1]*ap);f.add(g);
  const fr=new THREE.Mesh(arch(.5,1.05),frame);fr.position.z=.012;g.add(fr);
  const gl=new THREE.Mesh(arch(.34,.9),glass);gl.position.set(0,.06,.026);g.add(gl);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(.36,.025,.02),frame);bar.position.set(0,.55,.03);g.add(bar);
  // lower panel
  const pn=new THREE.Mesh(new THREE.BoxGeometry(.62,.32,.03),frame);pn.position.set(0,1.55,.015);g.add(pn);}
// columns at vertices
for(let i=0;i<8;i++){const a=i*Math.PI/4+Math.PI/8,x=Math.sin(a)*(shaftR+.02),z=Math.cos(a)*(shaftR+.02);
  add(new THREE.CylinderGeometry(.09,.1,shaftH,14),cream,x,shaftY0+shaftH/2,z,f);
  add(new THREE.CylinderGeometry(.14,.14,.07,14),cream,x,shaftY0+shaftH-.02,z,f);
  add(new THREE.CylinderGeometry(.14,.14,.07,14),cream,x,shaftY0+.04,z,f);}
// top cornice
const topY=shaftY0+shaftH; // 6.51
oct(1.78,.12,cream,topY+.06);
oct(1.62,.5,cream,topY+.37);
oct(1.78,.14,cream,topY+.69);
// crenellations
const cy=topY+.76;
for(let i=0;i<24;i++){const a=i*Math.PI/12,r=1.78*Math.cos(Math.PI/8)*0+1.68;
  const m=add(new THREE.BoxGeometry(.2,.14,.1),cream,Math.sin(a)*r,cy+.04,Math.cos(a)*r,f);m.rotation.y=a;}
// dome
const prof=[[0.01,0],[1.0,0],[1.15,.15],[1.4,.55],[1.52,.98],[1.42,1.42],[1.12,1.88],[.68,2.32],[.32,2.66],[.12,2.9],[.05,3.05]]
  .map(p=>new THREE.Vector2(p[0],p[1]));
const pts=new THREE.SplineCurve(prof).getPoints(70).map(p=>new THREE.Vector2(Math.max(p.x,0.001),p.y));
const dg=new THREE.LatheGeometry(pts,128);
const pos=dg.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),y=pos.getY(i),th=Math.atan2(z,x);
  const k=1+.045*Math.cos(th*16)*Math.min(1,y/.4);pos.setX(i,x*k);pos.setZ(i,z*k)}
dg.computeVertexNormals();
const domeY=cy+.1;
add(dg,copper,0,domeY,0,f);
// scalloped skirt
for(let i=0;i<32;i++){const a=i*Math.PI/16;
  const c=add(new THREE.ConeGeometry(.11,.2,4),copper,Math.sin(a)*1.08,domeY+.02,Math.cos(a)*1.08,f);c.rotation.x=Math.PI;c.rotation.y=a+Math.PI/4;}
// finial
const fy=domeY+3.05;
add(new THREE.CylinderGeometry(.03,.05,.5,10),M(0xc8ccd0,{metalness:.7,roughness:.3}),0,fy+.2,0,f);
[.25,.42,.58].forEach((o,i)=>add(new THREE.SphereGeometry(.075-i*.012,14,10),M(0xc8ccd0,{metalness:.7,roughness:.3}),0,fy+o,0,f));
add(new THREE.ConeGeometry(.025,.2,8),M(0xc8ccd0,{metalness:.7}),0,fy+.75,0,f);



// orbit controls (minimal)
let theta=.6,phi=1.25,dist=19,tgt=new THREE.Vector3(0,4.6,0),auto=true;
function upd(){camera.position.set(tgt.x+dist*Math.sin(phi)*Math.sin(theta),tgt.y+dist*Math.cos(phi),tgt.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(tgt)}
const el=renderer.domElement,ptrs=new Map();let pd=0;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);el.style.cursor='grabbing'});
el.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);pd=0;el.style.cursor='grab'});
el.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){theta-=(e.clientX-p[0])*.006;phi=Math.min(1.52,Math.max(.25,phi-(e.clientY-p[1])*.006))}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)dist=Math.min(40,Math.max(6,dist*pd/d));pd=d}});
el.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(40,Math.max(6,dist*(1+e.deltaY*.001)))},{passive:false});
document.getElementById('rot').onclick=e=>{auto=!auto;e.target.textContent='Auto‑rotate: '+(auto?'on':'off')};
addEventListener('resize',()=>{renderer.setSize(W(),H());camera.aspect=W()/H();camera.updateProjectionMatrix()});
(function loop(){requestAnimationFrame(loop);if(auto&&!ptrs.size)theta+=.003;upd();renderer.render(scene,camera)})();
</script>
</body>
</html>
