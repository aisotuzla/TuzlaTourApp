  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }

    #app-splash.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 2rem;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
    }

    .loader-ring {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(30, 58, 138, 0.1);
      border-radius: 50%;
      border-top-color: #1e3a8a;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <style id="_goober">
    .go2281452115 {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 16px 64px rgba(0, 0, 0, 0.16);

      margin: auto;
    }

    @media (max-width: 440px) {
      .go2281452115 {
        width: 100%;
        height: fit-content;

    .go3288899091 {

    tc-root * {

      padding: 0;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    tc-root img {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    tc-root *:focus {
      outline: #08f auto 2px;
    }

    tc-root li {
      list-style: none;
    }

    tc-root button {
      outline: none;
    }

    body.tc-disable-scroll {
      position: fixed;
      overflow-y: scroll;
      right: 0;
      left: 0;
    }

    body.tc-using-mouse tc-root *:focus {
      outline: none;
    }
