<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Entry Maze</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --wall: #4e4e6a;
            --path: #ffffff;
            --player: #00d2ff;
            --accent: #ff007a;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg);
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
            /* Prevents scrolling while playing */
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        #maze-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 4px solid var(--wall);
            line-height: 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        .label {
            position: absolute;
            font-weight: bold;
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>Maze Escape</h2>
        <p>Find an exit! Drag or swipe to move.</p>
    </div>

    <div id="maze-container">
        <canvas id="mazeCanvas"></canvas>
    </div>

    <div class="controls">
        <button onclick="initMaze()">New Maze</button>
    </div>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');

        let gridSize = 21; // Must be odd
        let cellSize;
        let maze = [];
        let playerPath = [];
        let isDrawing = false;

        // Maze cell structure
        const WALL = 1;
        const PATH = 0;

        function initMaze() {
            // Adjust size for mobile screens
            const screenSide = Math.min(window.innerWidth * 0.9, 500);
            canvas.width = screenSide;
            canvas.height = screenSide;
            cellSize = canvas.width / gridSize;

            // 1. Fill with walls
            maze = Array(gridSize).fill().map(() => Array(gridSize).fill(WALL));

            // 2. Generate Maze using Recursive Backtracker
            function carve(x, y) {
                const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
                maze[y][x] = PATH;

                for (let [dx, dy] of dirs) {
                    let nx = x + dx, ny = y + dy;
                    if (nx > 0 && nx < gridSize - 1 && ny > 0 && ny < gridSize - 1 && maze[ny][nx] === WALL) {
                        maze[y + dy / 2][x + dx / 2] = PATH;
                        carve(nx, ny);
                    }
                }
            }
            carve(1, 1);

            // 3. Add Multiple Entrances (Left Side)
            maze[1][0] = PATH;
            maze[gridSize - 2][0] = PATH;

            // 4. Add Multiple Exits (Right Side)
            maze[1][gridSize - 1] = PATH;
            maze[gridSize - 2][gridSize - 1] = PATH;

            // Reset Player
            playerPath = [];
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Maze
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    ctx.fillStyle = maze[y][x] === WALL ? '#4e4e6a' : '#ffffff';
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize + 1, cellSize + 1);
                }
            }

            // Draw Start/End Labels
            ctx.fillStyle = "#ff007a";
            ctx.font = "bold 10px Arial";
            ctx.fillText("ENTRY", 2, cellSize * 1.5);
            ctx.fillText("ENTRY", 2, cellSize * (gridSize - 1.5));
            ctx.fillText("EXIT", canvas.width - 30, cellSize * 1.5);
            ctx.fillText("EXIT", canvas.width - 30, cellSize * (gridSize - 1.5));

            // Draw Player Path
            if (playerPath.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = "#00d2ff";
                ctx.lineWidth = cellSize * 0.4;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                const startX = playerPath[0].x * cellSize + cellSize / 2;
                const startY = playerPath[0].y * cellSize + cellSize / 2;
                ctx.moveTo(startX, startY);

                for (let i = 1; i < playerPath.length; i++) {
                    const px = playerPath[i].x * cellSize + cellSize / 2;
                    const py = playerPath[i].y * cellSize + cellSize / 2;
                    ctx.lineTo(px, py);
                }
                ctx.stroke();

                // Draw Head
                const head = playerPath[playerPath.length - 1];
                ctx.fillStyle = "#00d2ff";
                ctx.beginPath();
                ctx.arc(head.x * cellSize + cellSize / 2, head.y * cellSize + cellSize / 2, cellSize / 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function handleInput(e) {
            if (!isDrawing && e.type !== 'touchstart' && e.type !== 'mousedown') return;

            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = Math.floor((clientX - rect.left) / cellSize);
            const y = Math.floor((clientY - rect.top) / cellSize);

            if (x < 0 || x >= gridSize || y < 0 || y >= gridSize) return;

            // Start condition: Must click near an entrance or an existing path
            if (playerPath.length === 0) {
                if (maze[y][x] === PATH && (x === 0)) {
                    playerPath.push({ x, y });
                }
            } else {
                const last = playerPath[playerPath.length - 1];

                // Only move if adjacent and is a path
                if (maze[y][x] === PATH) {
                    const dx = Math.abs(x - last.x);
                    const dy = Math.abs(y - last.y);

                    if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                        // Prevent backtracking (simple undo)
                        if (playerPath.length > 1 && x === playerPath[playerPath.length - 2].x && y === playerPath[playerPath.length - 2].y) {
                            playerPath.pop();
                        } else {
                            playerPath.push({ x, y });
                        }

                        // Check Win
                        if (x === gridSize - 1) {
                            setTimeout(() => {
                                alert("You Escaped!");
                                initMaze();
                            }, 50);
                        }
                    }
                }
            }
            draw();
        }

        // Event Listeners
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; handleInput(e); });
        window.addEventListener('mousemove', (e) => { if (isDrawing) handleInput(e); });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; handleInput(e); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { if (isDrawing) handleInput(e); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchend', () => { isDrawing = false; });

        // Initialize
        initMaze();
    </script>
</body>

</html>
